<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#00d4ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Odds Calc" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Odds Calculator</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; -webkit-tap-highlight-color:transparent; }
    body {
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
      min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px; color: #fff;
    }
    .container {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px; padding: 40px 28px;
      width: 100%; max-width: 380px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }
    h1 { text-align:center; font-size:1.5rem; font-weight:600; margin-bottom:6px; color:#00d4ff; }
    .subtitle { text-align:center; font-size:0.85rem; color:rgba(255,255,255,0.5); margin-bottom:28px; }
    .input-group { margin-bottom:22px; }
    label { display:block; font-size:0.9rem; color:rgba(255,255,255,0.7); margin-bottom:8px; font-weight:500; }
    input {
      width:100%; padding:16px 18px; font-size:1.3rem; font-weight:600;
      background:rgba(255,255,255,0.08); border:2px solid rgba(255,255,255,0.12);
      border-radius:14px; color:#fff; outline:none; -webkit-appearance:none;
    }
    input:focus { border-color:#00d4ff; background:rgba(0,212,255,0.08); box-shadow:0 0 0 4px rgba(0,212,255,0.15); }
    input::placeholder { color:rgba(255,255,255,0.3); font-weight:400; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
    input[type=number] { -moz-appearance:textfield; }
    .example { text-align:center; font-size:0.75rem; color:rgba(255,255,255,0.4); margin-top:6px; }
    .result-box {
      background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(0,255,136,0.1));
      border:1px solid rgba(0,212,255,0.3); border-radius:16px;
      padding:28px 20px; text-align:center; margin-top:8px;
    }
    .result-label { font-size:0.9rem; color:rgba(255,255,255,0.6); margin-bottom:10px; }
    .result-amount { font-size:2.5rem; font-weight:700; color:#00ff88; letter-spacing:-1px; word-break:break-all; }
    .result-amount.zero { color:rgba(255,255,255,0.3); }
    .hint { text-align:center; font-size:0.75rem; color:rgba(255,255,255,0.35); margin-top:24px; line-height:1.5; }
    .error { color:#ff6b6b; font-size:0.85rem; text-align:center; margin-top:12px; display:none; }
    .install-btn {
      display:none; width:100%; margin-top:20px; padding:14px;
      background:linear-gradient(135deg,#00d4ff,#00ff88); border:none; border-radius:12px;
      color:#0f0f23; font-size:1rem; font-weight:700; cursor:pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Odds Calculator</h1>
    <p class="subtitle">Sirf odds aur amount daalo</p>

    <div class="input-group">
      <label for="odds">Odds</label>
      <input type="number" id="odds" placeholder="17" step="1" min="1" inputmode="numeric" />
      <div class="example">Example: 1.17 → 17 | 1.25 → 25 | 1.40 → 40</div>
    </div>

    <div class="input-group">
      <label for="risk">Risk Amount</label>
      <input type="number" id="risk" placeholder="500" step="1" min="1" inputmode="numeric" />
    </div>

    <div class="result-box">
      <div class="result-label">Opposite Team Amount</div>
      <div class="result-amount zero" id="result">—</div>
    </div>
    <div class="error" id="error"></div>
    <button class="install-btn" id="installBtn">Install App</button>
    <p class="hint">Amount = Risk ÷ (Odds ÷ 100)</p>
  </div>

  <script>
    const oddsInput = document.getElementById('odds');
    const riskInput = document.getElementById('risk');
    const resultEl = document.getElementById('result');
    const errorEl = document.getElementById('error');
    const installBtn = document.getElementById('installBtn');

    function calculate() {
      const oddsRaw = parseFloat(oddsInput.value);
      const risk = parseFloat(riskInput.value);
      errorEl.style.display = 'none';

      if (!oddsRaw || !risk || isNaN(oddsRaw) || isNaN(risk)) {
        resultEl.textContent = '—';
        resultEl.classList.add('zero');
        return;
      }
      if (oddsRaw <= 0) {
        errorEl.textContent = 'Odds 0 se zyada hona chahiye';
        errorEl.style.display = 'block';
        resultEl.textContent = '—';
        resultEl.classList.add('zero');
        return;
      }
      if (risk <= 0) {
        errorEl.textContent = 'Risk amount positive hona chahiye';
        errorEl.style.display = 'block';
        resultEl.textContent = '—';
        resultEl.classList.add('zero');
        return;
      }
      const odds = oddsRaw / 100;
      const amount = risk / odds;
      resultEl.textContent = amount.toFixed(2);
      resultEl.classList.remove('zero');
    }

    oddsInput.addEventListener('input', calculate);
    riskInput.addEventListener('input', calculate);

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = 'none';
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
    setTimeout(() => oddsInput.focus(), 300);
  </script>
</body>
</html>
